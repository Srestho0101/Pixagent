<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Status Assistant</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --chat-bg: #ffffff;
            --text: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --user-bubble: #4f46e5;
            --user-text: #ffffff;
            --assistant-bubble: #f3f4f6;
            --assistant-text: #111827;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Header */
        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 64px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Ticket ID Input Screen */
        .ticket-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            gap: 24px;
        }

        .ticket-icon {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .ticket-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .ticket-subtitle {
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
        }

        .ticket-input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ticket-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .ticket-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Chat Screen */
        .chat-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: var(--assistant-bubble);
            color: var(--assistant-text);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 0 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--assistant-bubble);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            background: var(--chat-bg);
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 24px;
            font-size: 14px;
            transition: border-color 0.2s;
            resize: none;
            max-height: 100px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 20px;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error);
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
        }

        /* Mobile responsiveness */
        @media (min-width: 768px) {
            .container {
                border-radius: 16px;
                height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" id="backBtn" style="display: none;" onclick="showTicketScreen()">
                    ←
                </button>
                <div class="header-title">Repair Assistant</div>
            </div>
            <div class="status-badge" id="statusBadge" style="display: none;"></div>
        </div>

        <!-- Ticket ID Input Screen -->
        <div class="ticket-screen" id="ticketScreen">
            <div class="ticket-icon">💻</div>
            <div class="ticket-title">Check Your Repair Status</div>
            <div class="ticket-subtitle">
                Enter your ticket ID to chat with our assistant about your device repair status
            </div>
            <div class="ticket-input-group">
                <input 
                    type="text" 
                    class="ticket-input" 
                    id="ticketIdInput" 
                    placeholder="Enter ticket ID (e.g., 123)"
                    autocomplete="off"
                />
                <button class="btn-primary" id="startChatBtn" onclick="startChat()">
                    Start Chat
                </button>
                <div class="error-message" id="ticketError" style="display: none;"></div>
            </div>
        </div>

        <!-- Chat Screen -->
        <div class="chat-screen" id="chatScreen" style="display: none;">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <textarea 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Type your message..." 
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentTicketId = null;
        let isProcessing = false;
        let messages = [];

        // Auto-resize textarea
        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Handle Enter key
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Show ticket screen
        function showTicketScreen() {
            document.getElementById('ticketScreen').style.display = 'flex';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('statusBadge').style.display = 'none';
            currentTicketId = null;
            messages = [];
        }

        // Start chat with ticket ID
        async function startChat() {
            const ticketId = document.getElementById('ticketIdInput').value.trim();
            const errorElement = document.getElementById('ticketError');

            if (!ticketId) {
                errorElement.textContent = 'Please enter a ticket ID';
                errorElement.style.display = 'block';
                return;
            }

            if (!/^\d+$/.test(ticketId)) {
                errorElement.textContent = 'Ticket ID must be a number';
                errorElement.style.display = 'block';
                return;
            }

            errorElement.style.display = 'none';
            currentTicketId = ticketId;
            messages = [];

            // Switch to chat screen
            document.getElementById('ticketScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'flex';
            document.getElementById('statusBadge').style.display = 'block';
            document.getElementById('statusBadge').textContent = `Ticket #${ticketId}`;
            
            // Clear chat
            document.getElementById('messages').innerHTML = '';
            document.getElementById('chatInput').value = '';

            // Send initial greeting
            await sendMessage(true);
        }

        // Send message to AI
        async function sendMessage(isInitial = false) {
            if (isProcessing) return;

            const input = document.getElementById('chatInput');
            const message = isInitial ? "Hello! I'd like to check my repair status." : input.value.trim();

            if (!message) return;

            // Add user message to chat
            addMessage('user', message);
            
            if (!isInitial) {
                input.value = '';
                input.style.height = 'auto';
            }

            // Show typing indicator
            showTypingIndicator();
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                // Call backend API (to be created)
                const response = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ticket_id: parseInt(currentTicketId),
                        message: message,
                        history: messages.slice(-10) // Send last 10 messages for context
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Handle streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                
                // Create assistant message bubble
                const assistantMessageElement = addMessage('assistant', '');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    assistantMessage += parsed.content;
                                    assistantMessageElement.querySelector('.message-bubble').textContent = assistantMessage;
                                    // Scroll to bottom
                                    scrollToBottom();
                                }
                            } catch (e) {
                                // Ignore malformed JSON
                            }
                        }
                    }
                }

                // Add assistant message to history
                messages.push({ role: 'user', content: message });
                messages.push({ role: 'assistant', content: assistantMessage });

            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', 'Sorry, I encountered an error. Please try again later.');
            } finally {
                removeTypingIndicator();
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                scrollToBottom();
            }
        }

        // Add message to chat
        function addMessage(role, content) {
            const messagesContainer = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${role}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageElement.appendChild(bubble);
            messageElement.appendChild(time);
            messagesContainer.appendChild(messageElement);
            
            scrollToBottom();
            return messageElement;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('messages');
            const typingElement = document.createElement('div');
            typingElement.className = 'typing-indicator';
            typingElement.id = 'typingIndicator';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingElement.appendChild(dot);
            }
            
            messagesContainer.appendChild(typingElement);
            scrollToBottom();
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typingElement = document.getElementById('typingIndicator');
            if (typingElement) {
                typingElement.remove();
            }
        }

        // Scroll to bottom of messages
        function scrollToBottom() {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Handle initial load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('ticketIdInput').focus();
        });
    </script>
</body>
</html>
